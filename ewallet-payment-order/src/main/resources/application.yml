server:
  port: 8082

spring:
  application:
    name: ewallet-payment-order
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:ewallet}
    password: ${SPRING_DATASOURCE_PASSWORD:ewallet}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-status-cg
      auto-offset-reset: earliest

# gRPC client -> ewallet-payment-business (dùng ở Stage C)
grpc:
  client:
    payment-business:
      address: ${GRPC_BUSINESS_TARGET:static://ewallet-payment-business:9091}
      negotiation-type: plaintext

app:
  kafka:
    payment-events-topic: ewallet.payment.events

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8083

spring:
  application:
    name: ewallet-payment-business
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${SPRING_DATASOURCE_USERNAME:ewallet}
    password: ${SPRING_DATASOURCE_PASSWORD:ewallet}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

grpc:
  server:
    port: 9091

thirdparty:
  base-url: ${THIRDPARTY_BASE_URL:http://ewallet-third-party:8084}

app:
  kafka:
    payment-events-topic: ewallet.payment.events

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

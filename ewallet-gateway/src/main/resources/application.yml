server:
  port: 8080

spring:
  application:
    name: ewallet-gateway
  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Gateway, ewallet-gateway
      # Demo: frontend chay o origin khac (Vite 5173 hoac nginx 18000) nen can CORS.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      # Thu tu route quan trong: route cu the dat TRUOC route /api/** fallback.
      routes:
        - id: notifications
          uri: ${NOTIFICATION_URI:http://ewallet-notification:8085}
          predicates:
            - Path=/api/notifications/**
        - id: wallet
          uri: ${MOBILEAPP_URI:http://ewallet-business-customer-mobileapp:8081}
          predicates:
            - Path=/api/wallet/**
        - id: orders-internal
          uri: ${ORDER_URI:http://ewallet-payment-order:8082}
          predicates:
            - Path=/orders/**
          filters:
            - RewritePath=/orders/(?<seg>.*), /api/orders/$\{seg}
        # Endpoint noi bo cua payment-business. Khong phai duong khach hang -
        # mo qua gateway de UI demo va Ops doc duoc so du, han muc, but toan.
        - id: admin
          uri: ${BUSINESS_URI:http://ewallet-payment-business:8083}
          predicates:
            - Path=/admin/**
        - id: mobileapp
          uri: ${MOBILEAPP_URI:http://ewallet-business-customer-mobileapp:8081}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
      # globalcors o tren chi ap cho route cua gateway, KHONG ap cho /actuator/**.
      # Demo Console (18000) goi /actuator/health de hien "gateway san sang"; thieu cau hinh
      # nay thi trinh duyet chan doc response va bao "khong ket noi duoc gateway" du gateway van song.
      cors:
        allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true

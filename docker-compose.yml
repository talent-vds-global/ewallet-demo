# Demo App — hạ tầng + 6 service ewallet + partner-sim.
#   docker compose --profile infra up -d      # chỉ Postgres + Kafka + otel-collector + Jaeger + Grafana/Loki/Tempo
#   docker compose --profile all up --build   # toàn bộ (Stage B: boot + trace, chưa có nghiệp vụ)
#
# Host port các service ewallet dời sang dải 18xxx để tránh đụng cổng máy dev (8080...).
# Trong mạng compose vẫn dùng cổng gốc (8080-8090, 9091, 9876).

name: ewallet-demo

# Cap heap: JVM mac dinh lay 1/4 RAM NHIN THAY DUOC, trong container la 1/4 cua ca may Docker
# (~1,85 GB moi service) -> 7 service co the phinh toi ~13 GB. MaxRAMPercentage=50 buoc JVM tinh
# theo mem_limit cua chinh container do. SerialGC nhe hon G1 o heap nho, du cho quy mo demo.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=ewallet,deployment.environment=demo
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: otlp
  # Tat instrumentation spring-data cua OTel agent: no chen RepositoryInterceptor vao
  # call stack, khien database-quality-library (Topic #80) quy MOI cau SQL ve lop cua
  # chinh agent thay vi lop nghiep vu. Tat di thi calledFrom tren dashboard db-quality
  # tro lai dung (vd "OrderHistoryService:67 -> history()"). Span JDBC van con nen
  # trace khong mat gi. Chi tiet: docs/db-quality-integration.md muc 5b.
  # otel.javaagent.extensions: nap extension call-logger — moi lan service goi nhau (HTTP, gRPC,
  # Kafka, WebSocket) ban mot log SERVICE_CALL mang trace_id sang Loki. Jar do service
  # otel-ext-build dung roi dat vao volume otel-ext. Chi tiet: docs/logging.md
  # capture-headers=x-attempt: ghi header retry cua notification vao span Kafka thanh attribute
  # messaging.header.x_attempt -> Trace Analyzer tach first_attempt / retry / dead_letter.
  # Thieu dong nay thi span Kafka khong mang so lan thu (agent mac dinh khong chep header).
  JAVA_TOOL_OPTIONS: >-
    -javaagent:/otel/opentelemetry-javaagent.jar
    -Dotel.javaagent.extensions=/otel/ext/call-logger.jar
    -XX:MaxRAMPercentage=50
    -XX:+UseSerialGC
    -Dotel.instrumentation.spring-data.enabled=false
    -Dotel.instrumentation.messaging.experimental.capture-headers=x-attempt

services:
  # ---------- Hạ tầng ----------
  postgres:
    image: postgres:16
    profiles: ["infra", "all"]
    environment:
      POSTGRES_USER: ewallet
      POSTGRES_PASSWORD: ewallet
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewallet -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    profiles: ["infra", "all"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Mac dinh image dung -Xmx1G, quy mo demo khong can nhieu the.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    profiles: ["infra", "all"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - ./infra/otel-collector/traces:/traces
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger, tempo, loki]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["infra", "all"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  # ---------- Log + trace tap trung: Grafana (UI) + Loki (log) + Tempo (trace) ----------
  loki:
    image: grafana/loki:3.2.1
    profiles: ["infra", "all"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    ports: ["13100:3100"]   # API Loki, de tra log bang curl / logcli
    mem_limit: 384m

  # Tempo chay bang user 10001 nhung volume moi tao thuoc root -> chown mot lan roi thoat
  # (cung cach vi du docker-compose chinh thuc cua Tempo).
  tempo-init:
    image: grafana/tempo:2.6.1
    profiles: ["infra", "all"]
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempodata:/var/tempo

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["infra", "all"]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempodata:/var/tempo
    ports: ["13200:3200"]   # API Tempo (/api/search, /api/traces/<id>) cho Trace Analyzer va curl
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["infra", "all"]
    environment:
      # Demo noi bo: vao thang khong can dang nhap. KHONG dung cau hinh nay tren VDS that.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-calls.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["18088:3000"]
    depends_on: [loki, tempo]
    mem_limit: 256m

  # Build extension call-logger (otel-extensions/call-logger) roi chep jar vao volume otel-ext.
  # Chay mot lan roi thoat; moi service Java cho no xong moi khoi dong.
  otel-ext-build:
    build: ./otel-extensions/call-logger
    profiles: ["all"]
    volumes:
      - otel-ext:/otel-ext

  # ---------- Service ewallet (Dockerfile ở giai đoạn B) ----------
  ewallet-gateway:
    build: ./ewallet-gateway
    profiles: ["all"]
    mem_limit: 384m
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ewallet-gateway
    ports: ["18080:8080"]
    volumes:
      - otel-ext:/otel/ext:ro
    depends_on:
      otel-ext-build: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
      ewallet-business-customer-mobileapp: { condition: service_started }

  ewallet-business-customer-mobileapp:
    build: ./ewallet-business-customer-mobileapp
    profiles: ["all"]
    mem_limit: 384m
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ewallet-business-customer-mobileapp
    ports: ["18081:8081"]
    volumes:
      - otel-ext:/otel/ext:ro
    depends_on:
      otel-ext-build: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
      ewallet-payment-order: { condition: service_started }

  ewallet-payment-order:
    build: ./ewallet-payment-order
    profiles: ["all"]
    mem_limit: 640m
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ewallet-payment-order
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_BUSINESS_TARGET: static://ewallet-payment-business:9091
    ports:
      - "18082:8082"
      - "19082:9876"   # database-quality-library dashboard
    volumes:
      - ./infra/db-quality/reports:/reports
      - otel-ext:/otel/ext:ro
    depends_on:
      otel-ext-build: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  ewallet-payment-business:
    build: ./ewallet-payment-business
    profiles: ["all"]
    mem_limit: 640m
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ewallet-payment-business
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      THIRDPARTY_BASE_URL: http://ewallet-third-party:8084
    ports:
      - "18083:8083"
      - "19091:9091"
      - "19083:9876"   # database-quality-library dashboard
    volumes:
      - ./infra/db-quality/reports:/reports
      - otel-ext:/otel/ext:ro
    depends_on:
      otel-ext-build: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  ewallet-third-party:
    build: ./ewallet-third-party
    profiles: ["all"]
    mem_limit: 512m
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ewallet-third-party
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thirdpartydb
      PARTNER_SIM_BASE_URL: http://partner-sim:8090
      PARTNER_SIM_WS_URL: ws://partner-sim:8090/ws/partner
    ports:
      - "18084:8084"
      - "19084:9876"   # database-quality-library dashboard
    volumes:
      - ./infra/db-quality/reports:/reports
      - otel-ext:/otel/ext:ro
    depends_on:
      otel-ext-build: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  ewallet-notification:
    build: ./ewallet-notification
    profiles: ["all"]
    mem_limit: 512m
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ewallet-notification
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "18085:8085"
      - "19085:9876"   # database-quality-library dashboard
    volumes:
      - ./infra/db-quality/reports:/reports
      - otel-ext:/otel/ext:ro
    depends_on:
      otel-ext-build: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # ---------- Frontend demo (tinh, khong build step) ----------
  frontend:
    build: ./frontend
    profiles: ["all"]
    ports: ["18000:80"]
    depends_on: [ewallet-gateway]
    mem_limit: 64m

  # ---------- Cong cu quan sat (nhe, chi de xem du lieu) ----------
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    profiles: ["infra", "all"]
    environment:
      KAFKA_BROKERS: kafka:9092
    ports: ["18086:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 256m

  adminer:
    image: adminer:4.8.1-standalone
    profiles: ["infra", "all"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports: ["18087:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 128m

  partner-sim:
    build: ./partner-sim
    profiles: ["all"]
    mem_limit: 384m
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: partner-sim
    ports: ["18090:8090"]
    volumes:
      - otel-ext:/otel/ext:ro
    depends_on:
      otel-ext-build: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

volumes:
  pgdata:
  lokidata:
  tempodata:
  otel-ext:

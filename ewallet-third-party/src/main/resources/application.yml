server:
  port: 8084

spring:
  application:
    name: ewallet-third-party
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/thirdpartydb}
    username: ${SPRING_DATASOURCE_USERNAME:ewallet}
    password: ${SPRING_DATASOURCE_PASSWORD:ewallet}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

partner-sim:
  base-url: ${PARTNER_SIM_BASE_URL:http://partner-sim:8090}
  ws-url: ${PARTNER_SIM_WS_URL:ws://partner-sim:8090/ws/partner}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

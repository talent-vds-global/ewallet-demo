# Loki 3.x single-binary, luu tren filesystem. Du cho quy mo demo, KHONG dung cho production.
# Nhan log truc tiep qua OTLP tai /otlp/v1/logs (otel-collector day vao).
#  - resource attribute (service.name, service.namespace...) -> label: service_name, service_namespace
#  - log attribute + trace_id/span_id -> structured metadata: call_direction, trace_id...
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h   # giu 7 ngay

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

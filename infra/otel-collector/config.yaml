# otel-collector (contrib). Nhận OTLP từ các service, xuất song song:
#  traces: file traces.jsonl (Trace Analyzer giai đoạn demo) + Jaeger + Tempo (Grafana; Trace Analyzer từ Stage F)
#  logs  : file logs.jsonl + Loki (Grafana) — gồm log nghiệp vụ và log SERVICE_CALL của call-logger
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  # Dinh dang file: MOI DONG la mot lo (batch) {"resourceSpans":[...]} gom span cua nhieu service,
  # KHONG phai moi dong mot trace. Mot trace co the nam rai o nhieu dong (span den muon: Kafka
  # consumer, retry) -> Trace Analyzer phai tu gom theo traceId.
  # Xoay vong: file dang ghi luon ten traces.jsonl; ban cu doi ten thanh
  # traces-<UTC yyyy-mm-ddThh-mm-ss.mmm>.jsonl. Doc theo thu tu: ban cu (sap theo ten) roi file hien tai.
  file/traces:
    path: /traces/traces.jsonl
    rotation:
      max_megabytes: 100
      max_days: 3
      max_backups: 10
  file/logs:
    path: /traces/logs.jsonl
    rotation:
      max_megabytes: 50
      max_days: 3
      max_backups: 10
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki 3.x nhận OTLP trực tiếp; exporter tự nối thêm /v1/logs
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, otlp/jaeger, otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs, otlphttp/loki]

# otel-collector (contrib). Nhận OTLP từ các service, xuất song song:
#  traces: file traces.jsonl (đầu vào Trace Analyzer) + Jaeger + Tempo (Grafana)
#  logs  : file logs.jsonl + Loki (Grafana) — gồm log nghiệp vụ và log SERVICE_CALL của call-logger
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  file/traces:
    path: /traces/traces.jsonl
  file/logs:
    path: /traces/logs.jsonl
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki 3.x nhận OTLP trực tiếp; exporter tự nối thêm /v1/logs
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, otlp/jaeger, otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs, otlphttp/loki]
